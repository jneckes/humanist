<!doctype html>
<!-- Fuzz gate self-test (finding 25): #a is computed and only reads like the literal that feeds #b, so an edit typed in #a lands in #b. Not a gate fixture: scripts/fuzz-selftest.mjs runs it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two totals</title>
<style>body{font:18px sans-serif;margin:20px} p{margin:6px 0}</style>
</head>
<body>
<h1>Summary</h1>
<p id="a"></p>
<p id="b"></p>
<script>
const word = 'Quarterly total';
document.getElementById('b').textContent = word;
// The first paragraph is computed: it reads the same, but no literal feeds it.
document.getElementById('a').textContent = ['Quarterly', 'total'].join(' ');
</script>
</body>
</html>
