<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parity seeded random</title>
<!--
  The seeded Math.random of the render-parity harness (test/parity/parity.spec.ts): slide 1 paints a box in a
  colour and at a place drawn with Math.random() at load, and a field of 400 dots, so any two unseeded loads
  differ there (about 16% of the slide). The harness gives every frame of both renders, and of its control
  render, the same seeded Math.random before any page script: slide 1 must then be identical to the byte in
  all three, and not reported as nondeterministic. Slides 2 and 3 are fixed.
-->
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font: 48px/1.2 Arial, sans-serif; }
  [data-slide] { position: absolute; inset: 0; padding: 80px; visibility: hidden; }
  [data-slide].on { visibility: visible; }
  #box { position: absolute; width: 640px; height: 360px; }
  .dot { position: absolute; width: 6px; height: 6px; background: #345; }
</style>
</head>
<body>
<section data-slide class="on" id="s1"><h1>Random colour</h1><div id="box"></div></section>
<section data-slide><h1>Fixed slide</h1><p>Nothing here changes between loads.</p></section>
<section data-slide><h1>Another fixed slide</h1><p>Three slides: 9.4 detects a generic engine from three siblings.</p></section>
<script>
  function c() { return Math.floor(Math.random() * 256); }
  var box = document.getElementById('box');
  box.style.background = 'rgb(' + c() + ',' + c() + ',' + c() + ')';
  box.style.left = (80 + Math.floor(Math.random() * 400)) + 'px';
  box.style.top = (220 + Math.floor(Math.random() * 200)) + 'px';
  var s1 = document.getElementById('s1');
  for (var i = 0; i < 400; i++) {
    var d = document.createElement('div');
    d.className = 'dot';
    d.style.left = Math.floor(Math.random() * 1590) + 'px';
    d.style.top = Math.floor(Math.random() * 890) + 'px';
    s1.appendChild(d);
  }
  var slides = document.querySelectorAll('[data-slide]'), cur = 0;
  document.addEventListener('keydown', function (e) {
    var next = e.key === 'ArrowRight' ? cur + 1 : e.key === 'ArrowLeft' ? cur - 1 : cur;
    if (next < 0 || next >= slides.length || next === cur) return;
    slides[cur].classList.remove('on');
    slides[next].classList.add('on');
    cur = next;
  });
</script>
</body>
</html>
