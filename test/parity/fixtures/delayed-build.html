<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delayed build</title>
<!--
  Minimal repro of a render-products finding (docs/PHASE1-RESULTS.md, PDF): each slide's panel is shown by a
  script 400 ms after the slide becomes current (setTimeout, no CSS animation, the same with reduced motion).
  6.7 step 3's settle (fonts, two frames, finite animations) has nothing to wait for, so a raster PDF page or a
  thumbnail captured right after it showed the slide without its panel, while a person (and the parity
  harness, which dwells 2 s on every slide) sees it. Fixed: visitSlides now waits for script-timed content
  (RenderView.waitScripted, slide-index.ts SCRIPTED_SETTLE), and test/parity/parity.spec.ts checks it.
-->
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f0; overflow: hidden; font: 48px/1.2 Arial, sans-serif; color: #222; }
  [data-slide] { position: absolute; inset: 0; padding: 80px; visibility: hidden; }
  [data-slide].on { visibility: visible; }
  .panel { width: 1200px; height: 500px; margin-top: 40px; background: #2d6cdf; visibility: hidden; }
  .panel.shown { visibility: visible; }
</style>
</head>
<body>
<section data-slide class="on"><h1>One</h1><div class="panel"></div></section>
<section data-slide><h1>Two</h1><div class="panel"></div></section>
<section data-slide><h1>Three</h1><div class="panel"></div></section>
<script>
  var slides = document.querySelectorAll('[data-slide]'), cur = 0, timer = 0;
  function reveal() {
    clearTimeout(timer);
    var p = slides[cur].querySelector('.panel');
    timer = setTimeout(function () { p.classList.add('shown'); }, 400);
  }
  document.addEventListener('keydown', function (e) {
    var next = e.key === 'ArrowRight' ? cur + 1 : e.key === 'ArrowLeft' ? cur - 1 : cur;
    if (next < 0 || next >= slides.length || next === cur) return;
    slides[cur].classList.remove('on');
    slides[cur].querySelector('.panel').classList.remove('shown');
    slides[next].classList.add('on');
    cur = next;
    reveal();
  });
  reveal();
</script>
</body>
</html>
