<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion read by script</title>
<style>
  body { margin: 0; font: 40px/1.3 system-ui, sans-serif; }
  .slide { display: none; padding: 60px; }
  .slide.on { display: block; }
</style>
</head>
<body>
<!-- Like Josh's decks: the engine reads prefers-reduced-motion once at load and routes slides by hash. In
     Review and Edit, Blueline emulates reduced motion and reloads the deck, keeping the hash. -->
<section class="slide" id="s1"><h1>First slide</h1></section>
<section class="slide" id="s2"><h1>Second slide</h1></section>
<section class="slide" id="s3"><h1>Third slide</h1></section>
<script>
(function () {
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.dataset.motion = RM ? 'reduce' : 'no-preference';
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  function show() {
    var i = parseInt((location.hash || '#1').slice(1), 10) - 1;
    if (!(i >= 0 && i < slides.length)) i = 0;
    slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
    document.documentElement.dataset.slide = String(i + 1);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
