<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Resume deck</title>
<style>html,body{margin:0;height:100%;font:32px/1.4 sans-serif}.slide{position:absolute;inset:0;padding:60px;display:none}.slide.on{display:block}</style></head>
<body>
<section class="slide"><h1>First slide title</h1><p>Opening words.</p></section>
<section class="slide"><h1>Second slide title</h1><p>Middle words.</p></section>
<section class="slide"><h1>Third slide title</h1><p>Closing words.</p></section>
<section class="slide"><h1>Fourth slide title</h1><p>Appendix words.</p></section>
<script>
// Resume where the reader left off (a common pattern in generated decks).
var s=[].slice.call(document.querySelectorAll('.slide'));
var cur=0; try{cur=Math.min(s.length-1,Math.max(0,parseInt(localStorage.getItem('slide')||'0',10)||0));}catch(e){}
s[cur].classList.add('on');
function show(i){s[cur].classList.remove('on');cur=i;s[cur].classList.add('on');try{localStorage.setItem('slide',String(cur));}catch(e){}}
addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&cur<s.length-1)show(cur+1);else if(e.key==='ArrowLeft'&&cur>0)show(cur-1);});
</script>
</body></html>
