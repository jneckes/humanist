<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Builds deck</title>
<style>
html,body{margin:0;height:100%;font:32px/1.4 sans-serif}
.slide{position:absolute;inset:0;padding:60px;display:none}
.slide.on{display:block}
.step{visibility:hidden}
.step.shown{visibility:visible}
</style></head>
<body>
<section class="slide on"><h1>Opening slide</h1><ul><li class="step">First build point</li><li class="step">Second build point</li></ul></section>
<section class="slide"><h1>Second slide title</h1><p>Body text on the second slide.</p></section>
<section class="slide"><h1>Third slide title</h1><p>Body text on the third slide.</p></section>
<section class="slide"><h1>Fourth slide title</h1><p>Body text on the fourth slide.</p></section>
<section class="slide"><h1>Fifth slide title</h1><p>Body text on the fifth slide.</p></section>
<script>
var slides=[].slice.call(document.querySelectorAll('.slide')),cur=0;
function show(i){slides[cur].classList.remove('on');cur=i;slides[cur].classList.add('on');}
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){
    var hidden=slides[cur].querySelector('.step:not(.shown)');
    if(hidden){hidden.classList.add('shown');return;}
    if(cur<slides.length-1)show(cur+1);
  } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ if(cur>0)show(cur-1); }
});
</script>
</body></html>
