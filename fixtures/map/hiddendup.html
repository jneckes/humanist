<style>html,body{margin:0;font:28px/1.4 sans-serif} .print-only{display:none} .later{position:absolute;top:2000px}</style></head>
<body>

<div class="print-only"><span id="pt"></span></div>

document.getElementById('t').textContent = DATA.title;

</script>
</body></html>
