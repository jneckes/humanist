<head>
<meta charset="utf-8">
<title>Foster-parented text</title>
</head>
<body>
<section class="slide">
<h1>Heading</h1>
<p id="note"></p>
<table><tr><td>Cell one</td></tr>Foster text<tr><td>Cell two</td></tr></table>
<p>After</p>

document.getElementById('note').textContent = 'Only the script says this';
</script>
