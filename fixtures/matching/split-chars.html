<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split text</title>
<style>body { margin: 0; font: 40px/1.3 system-ui, sans-serif; } .char, .word { display: inline-block; } h1, h2, p { margin: 48px; }</style>
</head>
<body>
<!-- Like the GSAP decks with motion on: after load, one heading is split into one span per letter and another
     into one span per word, each span built and then inserted. Literals elsewhere in the deck's code ('A',
     'work') equal a piece by coincidence; writing an edit of that piece to the literal would change the code,
     not the heading. -->
<h1 id="title">Agents at work</h1>
<h2 id="sub">Hours of work saved</h2>
<p id="note"></p>
<script>
(function () {
  var GRADE = 'A', MODE = 'work'; // used in code only, never shown
  function split(el, unit) {
    var text = el.textContent, parts = unit === 'char' ? text.split('') : text.split(/(\s+)/);
    el.textContent = '';
    parts.forEach(function (t) {
      if (/^\s+$/.test(t)) { el.appendChild(document.createTextNode(t)); return; }
      var s = document.createElement('span');
      s.className = unit;
      s.textContent = t;
      el.appendChild(s);
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    split(document.getElementById('title'), 'char');
    split(document.getElementById('sub'), 'word');
    document.getElementById('note').textContent = 'Only the script says this';
    document.documentElement.dataset.mode = GRADE + MODE;
  });
})();
</script>
</body>
</html>
