<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline-first field app</title>
<style>
  :root { --bg: #ecfdf5; --ink: #022c22; --muted: #047857; --accent: #10b981; --card: #ffffff; font-family: "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #022c22; overflow: hidden; }
  .deck { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%); }
  .slide { position: absolute; inset: 0; display: none; padding: 100px 128px; background: var(--bg); color: var(--ink); }
  .slide.active { display: block; }
  h1 { font-size: 96px; margin: 150px 0 24px; letter-spacing: -.02em; }
  h2 { font-size: 62px; margin: 0 0 44px; }
  .lede { font-size: 32px; color: var(--muted); }
  .logo { width: 96px; height: 96px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .card { background: var(--card); border-radius: 18px; padding: 32px; }
  .card h3 { font-size: 30px; margin: 0 0 12px; }
  .card p { font-size: 22px; color: var(--muted); margin: 0; line-height: 1.45; }
  .quote { font-size: 44px; line-height: 1.3; max-width: 1150px; }
</style>
<script>
  // Every CSP violation in this document, as "<effectiveDirective> <blockedURI>" joined by " | ", so a test can
  // tell the deck's own expected violations from any the overlay would cause (SPEC 9.1, Preload).
  (function () {
    var seen = [];
    document.addEventListener('securitypolicyviolation', function (e) {
      seen.push(e.effectiveDirective + ' ' + (e.blockedURI || '-'));
      document.documentElement.dataset.cspViolations = seen.join(' | ');
    });
  })();
</script>
</head>
<body>
<div class="deck" id="deck">
  <section class="slide active">
    <!-- img-src falls back to default-src 'none', so this data: image must not load. -->
    <img class="logo" id="logo" alt="Fieldkit logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ccircle cx='5' cy='5' r='5' fill='%2310b981'/%3E%3C/svg%3E">
    <h1>Fieldkit 2.0</h1>
    <p class="lede">Inspections that work with no signal</p>
  </section>
  <section class="slide">
    <h2>Built for the basement</h2>
    <div class="cards" id="cards"></div>
  </section>
  <section class="slide">
    <h2>From the pilot</h2>
    <p class="quote" id="quote"></p>
  </section>
</div>

<script>
  (function () {
    var CARDS = [
      { title: 'Works offline', body: 'Every form and photo is saved on the device first.' },
      { title: 'Syncs later', body: 'Changes upload in order when the connection returns.' },
      { title: 'No lost work', body: 'Conflicts are merged field by field, never overwritten.' },
    ];
    var QUOTE = 'Our inspectors stopped carrying paper the week we rolled it out.';

    var cards = document.getElementById('cards');
    CARDS.forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'card';
      var h3 = document.createElement('h3');
      h3.textContent = c.title;
      var p = document.createElement('p');
      p.textContent = c.body;
      card.append(h3, p);
      cards.appendChild(card);
    });
    document.getElementById('quote').textContent = QUOTE;

    addEventListener('load', function () {
      var logo = document.getElementById('logo');
      document.documentElement.dataset.imageBlocked = logo.complete && logo.naturalWidth === 0 ? 'yes' : 'no';
    });

    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var i = 0;
    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') show(i + 1);
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1);
    });
    function fit() {
      var s = Math.min(innerWidth / 1600, innerHeight / 900);
      document.getElementById('deck').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    }
    addEventListener('resize', fit);
    fit();

    document.documentElement.dataset.scriptsRan = 'yes';
  })();
</script>
</body>
</html>
