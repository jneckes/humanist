<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout redesign — results</title>
<style>
  :root {
    --paper: #fbfaf7;
    --ink: #1f2933;
    --muted: #697586;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --line: #e5e1d8;
    font-family: "Söhne", "Inter", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e7e3da; overflow: hidden; }
  .deck { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%); background: var(--paper); box-shadow: 0 30px 80px rgba(0,0,0,.15); }
  .slide { position: absolute; inset: 0; padding: 96px 128px 140px; color: var(--ink); opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s; }
  .slide.on { opacity: 1; visibility: visible; }
  .eyebrow { margin: 0 0 12px; font-size: 22px; color: var(--muted); }
  .kicker { display: inline-block; margin: 0 0 28px; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1, h2 { margin: 0 0 32px; font-size: 76px; line-height: 1.05; letter-spacing: -.02em; max-width: 1200px; }
  .lede { font-size: 38px; line-height: 1.35; color: var(--muted); max-width: 1100px; margin: 0 0 40px; }
  .rich { font-size: 34px; line-height: 1.4; max-width: 1150px; }
  .rich strong, .rich b { color: var(--accent); }
  blockquote { margin: 0 0 28px; padding-left: 28px; border-left: 6px solid var(--accent); font-size: 36px; line-height: 1.3; font-family: Georgia, serif; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 36px; background: #fff; }
  .card .label { font-size: 22px; color: var(--muted); }
  .card .value { font-size: 72px; font-weight: 700; margin: 8px 0; }
  .card .delta { font-size: 22px; color: var(--accent); }
  .chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 6px 20px; font-size: 22px; font-weight: 600; }
  .note { font-size: 24px; color: var(--muted); margin-top: 32px; }
  footer { position: absolute; left: 128px; right: 128px; bottom: 48px; display: flex; gap: 28px; font-size: 18px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }
  footer .page { margin-left: auto; }
</style>
</head>
<body>
<main id="deck" class="deck" data-client="Harbor &amp; Pine"></main>

<script type="application/json" id="deck-data">
{
  "client": "Harbor & Pine",
  "title": "Checkout redesign \u2014 results",
  "slides": [
    {
      "id": "summary",
      "kicker": "Summary",
      "title": "A calmer checkout",
      "lede": "Cart abandonment fell from 71% to 58% after the redesign.",
      "html": "<strong>Phase 1</strong> ships in <em>January</em>, behind a flag."
    },
    {
      "id": "voices",
      "kicker": "What we heard",
      "title": "Shoppers wanted fewer surprises",
      "quotes": [
        "\"Where's my order?\" was the top support question",
        "Shipping costs at the last step felt like a trick"
      ],
      "owner": "Research team"
    },
    {
      "id": "numbers",
      "kicker": "Eight weeks in",
      "title": "The numbers after launch",
      "metrics": {
        "Conversion": { "value": 3.4, "unit": "%", "delta": "+0.6 pts" },
        "Average order": { "value": 62, "unit": "$", "delta": "+$4" },
        "Retention": { "value": 41, "unit": "%", "delta": "+3 pts" }
      },
      "owner": "Research team"
    },
    {
      "id": "next",
      "kicker": "Next",
      "title": "Roll out in three waves",
      "html": "Wave 1: <b>EU</b> &amp; <b>UK</b>. Wave 2: <b>US</b>. Wave 3: everyone else.",
      "focus": "Retention",
      "note": "Owner sign-off needed by 14 November"
    }
  ]
}
</script>

<script type="module">
  (function () {
    const data = JSON.parse(document.getElementById('deck-data').textContent);
    const deck = document.getElementById('deck');

    function add(parent, tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      parent.appendChild(node);
      return node;
    }

    function formatValue(m) {
      return m.unit === '$' ? '$' + m.value : m.value + m.unit;
    }

    data.slides.forEach(function (s, i) {
      const sec = add(deck, 'section', 'slide');
      sec.id = s.id;
      if (i === 0) add(sec, 'p', 'eyebrow', data.title);
      add(sec, 'p', 'kicker', s.kicker);
      add(sec, i === 0 ? 'h1' : 'h2', null, s.title);
      if (s.lede) add(sec, 'p', 'lede', s.lede);
      if (s.html) add(sec, 'div', 'rich').innerHTML = s.html;
      (s.quotes || []).forEach(function (q) { add(sec, 'blockquote', null, q); });
      if (s.metrics) {
        const cards = add(sec, 'div', 'cards');
        for (const [label, m] of Object.entries(s.metrics)) {
          const card = add(cards, 'div', 'card');
          add(card, 'div', 'label', label);
          add(card, 'div', 'value', formatValue(m));
          add(card, 'div', 'delta', m.delta);
        }
      }
      if (s.focus) add(sec, 'span', 'chip', s.focus);
      if (s.note) add(sec, 'p', 'note', s.note);
      const foot = add(sec, 'footer');
      add(foot, 'span', 'client', data.client);
      if (s.owner) add(foot, 'span', 'owner', s.owner);
      add(foot, 'span', 'conf', 'Internal · do not forward');
      add(foot, 'span', 'page', (i + 1) + ' / ' + data.slides.length);
    });

    const slides = Array.from(deck.querySelectorAll('.slide'));
    let at = 0;
    function show(i) {
      at = Math.max(0, Math.min(slides.length - 1, i));
      slides.forEach(function (s, k) { s.classList.toggle('on', k === at); });
    }
    function fit() {
      const k = Math.min(innerWidth / 1600, innerHeight / 900);
      deck.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
    }
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(at + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(at - 1); }
    });
    addEventListener('resize', fit);
    fit();
    show(0);
  })();
</script>
</body>
</html>
