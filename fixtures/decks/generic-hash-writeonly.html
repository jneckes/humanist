<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden plan</title>
<style>
  :root { --bg: #f0fdf4; --ink: #14532d; --muted: #15803d; font-family: "Inter", "Avenir Next", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14532d; overflow: hidden; }
  .deck { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%); }
  .slide { position: absolute; inset: 0; padding: 120px 128px; background: var(--bg); color: var(--ink); display: none; }
  .slide.current { display: block; }
  h1 { font-size: 100px; margin: 160px 0 24px; }
  h2 { font-size: 64px; margin: 0 0 40px; }
  p { font-size: 34px; color: var(--muted); }
  .pager { position: absolute; right: 128px; bottom: 40px; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
<div class="deck">
  <section class="slide"><h1>Garden plan</h1><p>The first bed is marigold.</p></section>
  <section class="slide"><h2>Soil</h2><p>Mix compost with juniper bark.</p></section>
  <section class="slide"><h2>Seeds</h2><p>Sow lavender in March.</p></section>
  <section class="slide"><h2>Water</h2><p>Saffron needs little water.</p></section>
  <section class="slide"><h2>Pests</h2><p>Pull every thistle by hand.</p></section>
  <section class="slide"><h2>Harvest</h2><p>Cut clover in the autumn.</p></section>
  <p class="pager" id="pager"></p>
</div>

<script>
  // A slide engine that writes its place into the URL (#1, #2, …) on every move with history.replaceState but
  // reads location.hash only once, at load: no hashchange or popstate listener. It moves on ArrowRight and
  // ArrowLeft only and ignores PageUp and PageDown (fixtures/README.md: generic-hash-writeonly.html).
  (function () {
    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var pager = document.getElementById('pager');
    var current = 0;

    function clamp(i) {
      return Math.max(0, Math.min(slides.length - 1, i));
    }

    function show(i) {
      current = clamp(i);
      slides.forEach(function (s, k) { s.classList.toggle('current', k === current); });
      pager.textContent = (current + 1) + ' / ' + slides.length;
      history.replaceState(null, '', '#' + (current + 1));
    }

    var m = /^#(\d+)$/.exec(location.hash);
    if (m) current = clamp(parseInt(m[1], 10) - 1);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        show(current + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        show(current - 1);
      }
    });

    show(current);
  })();
</script>
</body>
</html>
