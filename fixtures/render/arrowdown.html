<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vertical deck</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .slide { position: absolute; inset: 0; box-sizing: border-box; padding: 100px; background: #f5f3ff; color: #3b0764; font: 48px/1.3 sans-serif; display: none; }
  .slide.active { display: block; }
</style>
</head>
<body>
  <!-- This engine moves only on the vertical arrows (6.7 Index replay: Session.deckNav ArrowDown / ArrowUp). -->
  <section class="slide active"><h1>Down one</h1><p>Press the down arrow.</p></section>
  <section class="slide"><h1>Down two</h1><p>Vertical only.</p></section>
  <section class="slide"><h1>Down three</h1><p>Still vertical.</p></section>
  <section class="slide"><h1>Down four</h1><p>Zebra quartz.</p></section>
<script>
  (function () {
    var slides = [].slice.call(document.querySelectorAll('.slide'));
    var cur = 0;
    addEventListener('keydown', function (e) {
      var n = e.key === 'ArrowDown' ? cur + 1 : e.key === 'ArrowUp' ? cur - 1 : cur;
      if (n === cur || n < 0 || n >= slides.length) return;
      slides[cur].classList.remove('active');
      cur = n;
      slides[cur].classList.add('active');
    });
  })();
</script>
</body>
</html>
