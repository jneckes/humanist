<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide strip</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* A slider engine: every slide is rendered side by side and the strip moves; the others are transparent but
     still rendered, so findInPage finds their text (off screen). */
  .strip { display: flex; width: 300vw; height: 100vh; transition: none; }
  .slide { flex: 0 0 100vw; height: 100vh; box-sizing: border-box; padding: 100px; font: 48px/1.3 sans-serif; background: #f0fdf4; color: #14532d; }
  .slide:not(.active) { opacity: 0; }
</style>
</head>
<body>
  <div class="strip">
    <section class="slide active"><h1>Strip one</h1><p>One quartz here.</p></section>
    <section class="slide"><h1>Strip two</h1><p>Nothing to find.</p></section>
    <section class="slide"><h1>Strip three</h1><p>A quartz, and a second quartz.</p></section>
  </div>
<script>
  (function () {
    var strip = document.querySelector('.strip');
    var slides = [].slice.call(document.querySelectorAll('.slide'));
    var cur = 0;
    function show(n) {
      if (n < 0 || n >= slides.length) return;
      slides[cur].classList.remove('active');
      cur = n;
      slides[cur].classList.add('active');
      strip.style.transform = 'translateX(' + (-100 * cur) + 'vw)';
      location.hash = '#' + (cur + 1);
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') show(cur + 1);
      else if (e.key === 'ArrowLeft') show(cur - 1);
    });
  })();
</script>
</body>
</html>
