<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Many builds</title>
<style>
  html, body { margin: 0; height: 100%; font: 40px/1.4 sans-serif; }
  .slide { position: absolute; inset: 0; padding: 80px; display: none; background: #eef2ff; }
  .slide.on { display: block; }
  .step { opacity: 0; }
  .step.shown { opacity: 1; }
</style>
</head>
<body>
  <!-- Five key-gated build steps before the deck moves on (F25: a press that shows a step uses up no retry). -->
  <section class="slide on"><h1>Builds</h1><ul><li class="step">Step one</li><li class="step">Step two</li><li class="step">Step three</li><li class="step">Step four</li><li class="step">Step five</li></ul></section>
  <section class="slide"><h1>After the builds</h1><p>Second slide.</p></section>
  <section class="slide"><h1>Last</h1><p>Third slide.</p></section>
<script>
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var cur = 0;
  function show(i) { slides[cur].classList.remove('on'); cur = i; slides[cur].classList.add('on'); }
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      var hidden = slides[cur].querySelector('.step:not(.shown)');
      if (hidden) { hidden.classList.add('shown'); return; }
      if (cur < slides.length - 1) show(cur + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (cur > 0) show(cur - 1); }
  });
</script>
</body>
</html>
