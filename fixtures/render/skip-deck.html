<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skip deck</title>
<!--
  Five generic slides in solid colours (red, green, blue, yellow, magenta), routed by an '#id' hash. ArrowRight
  and PageDown skip slide 3 (a slide hidden in the show), and a hashchange shows any slide, so the render
  walk reaches slide 3 by its hash, after the others. Save as PDF and Print must still lay the pages out in
  slide order (review finding 33).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 64px/1.2 Arial, sans-serif; color: #fff; }
  .slide { position: absolute; inset: 0; padding: 80px; box-sizing: border-box; display: none; }
  .slide.active { display: block; }
</style>
</head>
<body>
<section class="slide active" id="red" style="background: #fe0000"><h1>Red</h1></section>
<section class="slide" id="green" style="background: #00fe00"><h1>Green</h1></section>
<section class="slide" id="blue" style="background: #0000fe" data-hidden-in-show><h1>Blue</h1></section>
<section class="slide" id="yellow" style="background: #fefe00"><h1>Yellow</h1></section>
<section class="slide" id="magenta" style="background: #fe00fe"><h1>Magenta</h1></section>
<script>
  (function () {
    var slides = [].slice.call(document.querySelectorAll('.slide'));
    var cur = 0;
    function show(n) {
      if (n < 0 || n >= slides.length || n === cur) return;
      slides[cur].classList.remove('active');
      cur = n;
      slides[cur].classList.add('active');
      if (location.hash !== '#' + slides[cur].id) location.hash = slides[cur].id;
    }
    function step(d) {
      var n = cur + d;
      while (n >= 0 && n < slides.length && slides[n].hasAttribute('data-hidden-in-show')) n += d;
      show(n);
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
    });
    addEventListener('hashchange', function () {
      var id = location.hash.slice(1);
      for (var i = 0; i < slides.length; i++) if (slides[i].id === id) show(i);
    });
    var start = location.hash.slice(1);
    for (var i = 0; i < slides.length; i++) if (slides[i].id === start) show(i);
    if (location.hash !== '#' + slides[cur].id) location.hash = slides[cur].id;
  })();
</script>
</body>
</html>
