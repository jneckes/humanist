<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timer print deck</title>
<!--
  A print-CSS deck (an @page size that matches its 1280x720 slides, one slide per page) whose slide text a
  timer fills 500 ms after load (decision D-5): Save as PDF and Print must print the filled text, not
  PENDING (review finding 10).
-->
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  .deck { position: relative; width: 1280px; height: 720px; }
  .slide { position: absolute; inset: 0; width: 1280px; height: 720px; box-sizing: border-box; padding: 80px; background: #fdf6e3; color: #073642; font: 40px/1.3 sans-serif; display: none; }
  .slide.active { display: block; }
  h1 { font-size: 72px; margin: 0 0 24px; }
  @page { size: 1280px 720px; margin: 0; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    .slide { display: block; position: relative; page-break-after: always; }
    .slide:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="deck">
  <section class="slide active"><h1>Timer one</h1><p class="fill">PENDING ONE</p></section>
  <section class="slide"><h1>Timer two</h1><p class="fill">PENDING TWO</p></section>
  <section class="slide"><h1>Timer three</h1><p class="fill">PENDING THREE</p></section>
</div>
<script>
  (function () {
    var slides = [].slice.call(document.querySelectorAll('.slide'));
    var cur = 0;
    function show(n) {
      if (n < 0 || n >= slides.length) return;
      slides[cur].classList.remove('active');
      cur = n;
      slides[cur].classList.add('active');
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') show(cur + 1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(cur - 1);
    });
    setTimeout(function () {
      [].forEach.call(document.querySelectorAll('.fill'), function (p, i) { p.textContent = 'TIMER FILLED ' + (i + 1); });
    }, 500);
  })();
</script>
</body>
</html>
