<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linked print sheet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .slide { position: absolute; inset: 0; width: 1600px; height: 900px; box-sizing: border-box; padding: 100px; background: #ecfdf5; color: #064e3b; font: 48px/1.3 sans-serif; display: none; }
  .slide.active { display: block; }
</style>
<!-- After the page's own rules, so the print rules in the sibling sheet win. -->
<link rel="stylesheet" href="linked-print.css">
</head>
<body>
  <section class="slide active"><h1>Linked one</h1></section>
  <section class="slide"><h1>Linked two</h1></section>
  <section class="slide"><h1>Linked three</h1></section>
<script>
  (function () {
    var slides = [].slice.call(document.querySelectorAll('.slide'));
    var cur = 0;
    addEventListener('keydown', function (e) {
      var n = e.key === 'ArrowRight' ? cur + 1 : e.key === 'ArrowLeft' ? cur - 1 : cur;
      if (n === cur || n < 0 || n >= slides.length) return;
      slides[cur].classList.remove('active');
      cur = n;
      slides[cur].classList.add('active');
    });
  })();
</script>
</body>
</html>
