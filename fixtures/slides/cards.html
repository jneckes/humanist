<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cards deck</title>
<!-- SPEC 9.4 step 2, finding 29: 3 .slide divs (one shown), each an h2 and a grid of 4 <section class=card>. The cards inside a hidden slide are 4 siblings matching `section` with none visible; they must not be taken for the slides. Expect: generic, 3 slides "Slide 1 heading".., 3 of 3 reached, 15 visible text nodes. -->
<style>
  html, body { margin: 0; height: 100%; font: 28px/1.4 sans-serif; }
  .slide { position: absolute; inset: 0; padding: 60px; display: none; }
  .slide.on { display: block; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
</style>
</head>
<body>
<div class="slide on">
  <h2>Slide 1 heading</h2>
  <div class="grid"><section class="card"><h3>Card 1 on slide 1</h3></section><section class="card"><h3>Card 2 on slide 1</h3></section><section class="card"><h3>Card 3 on slide 1</h3></section><section class="card"><h3>Card 4 on slide 1</h3></section></div>
</div>
<div class="slide">
  <h2>Slide 2 heading</h2>
  <div class="grid"><section class="card"><h3>Card 1 on slide 2</h3></section><section class="card"><h3>Card 2 on slide 2</h3></section><section class="card"><h3>Card 3 on slide 2</h3></section><section class="card"><h3>Card 4 on slide 2</h3></section></div>
</div>
<div class="slide">
  <h2>Slide 3 heading</h2>
  <div class="grid"><section class="card"><h3>Card 1 on slide 3</h3></section><section class="card"><h3>Card 2 on slide 3</h3></section><section class="card"><h3>Card 3 on slide 3</h3></section><section class="card"><h3>Card 4 on slide 3</h3></section></div>
</div>
<script>
  var s = [].slice.call(document.querySelectorAll('.slide')), c = 0;
  function show(i) { s[c].classList.remove('on'); c = i; s[c].classList.add('on'); }
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' && c < s.length - 1) show(c + 1);
    else if (e.key === 'ArrowLeft' && c > 0) show(c - 1);
  });
</script>
</body>
</html>
