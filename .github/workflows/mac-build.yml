# Builds the macOS app for dogfooding (SPEC 10 Phase 1, Builds: "local unsigned builds") on a GitHub-hosted
# Apple silicon runner, so the app can be downloaded without a local toolchain. The app is signed ad hoc
# (scripts/mac-signing.cjs): no Developer ID, no notarization (Phase 6), so macOS asks once before it opens it
# (README.md, Dogfooding on a Mac). The Swift helper (native/macos) is compiled here too.
#
# It also runs what the Linux container cannot: the packaged app's automatic Diagnostics on a real Mac
# (npm run package:smoke: layout, `blueline check --auto` with F3, F4 and F5). Their results are uploaded but do
# not block the build artifact.
#
# Supply chain (docs/DEPENDENCIES.md): every action is pinned by commit SHA (the tag in a comment, which
# Dependabot updates with it); the lockfile is checked before anything is installed; npm ci runs no install
# scripts (.npmrc) and Electron's binary is the one explicit install step; registry signatures and provenance
# are verified; app.asar must hold no node_modules; the artifact carries an SBOM of what ships; and a separate job,
# the only one that can mint an OIDC token, attests the build provenance of the dmg, the zip and the SBOM
# (`gh attestation verify <file> --repo jneckes/humanist`).
name: Mac build

on:
  workflow_dispatch:
  push:
    branches: [claude/admiring-edison-1lohc0]
    paths-ignore: ['docs/**', '**/*.md', 'fixtures/**', 'test/**']

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check the lockfile (registry sources, sha512, exact pins, known install scripts)
        # Reads only package-lock.json and the package.json files, so it runs before anything is downloaded.
        run: npm run check:lockfile

      - name: Install dependencies (no install scripts, .npmrc)
        run: npm ci

      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures

      - name: Install Electron's binary (the one explicit install step)
        # electron's install.js checks the zip against electron's checksums.json, which the lockfile's integrity
        # covers. package:smoke packs with this local Electron.
        run: npm run install:electron

      - name: Build the Swift helper (default app, quarantine)
        run: native/macos/build.sh

      - name: Build the app (ad-hoc signed dmg and zip)
        # electron-builder publishes implicitly on CI; this job only uploads an artifact.
        run: npm run dist -- --publish never

      - name: Check what ships (app.asar holds no node_modules)
        run: node scripts/asar-contents.mjs release/mac-arm64/Blueline.app/Contents/Resources/app.asar

      - name: SBOM of what ships (CycloneDX)
        # The third-party packages esbuild bundled (out/esbuild-meta.json from this build) and Electron's zip.
        run: npm run sbom -- release/Blueline-sbom.cdx.json --platform darwin --arch arm64

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Blueline-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/Blueline-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Smoke test the packaged app on macOS (Diagnostics F3, F4, F5)
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p smoke
          set -o pipefail
          npm run package:smoke -- --out "$RUNNER_TEMP/smoke-pack" 2>&1 | tee smoke/package-smoke.log

      - name: Upload the smoke test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-smoke-results
          path: smoke/
          if-no-files-found: ignore
          retention-days: 30

  attest:
    # Signs the provenance of what the mac job built. It runs no project code (no checkout, no npm), so the
    # OIDC token it can mint never reaches a dependency.
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Blueline-mac-arm64
          path: release

      - name: Attest build provenance (dmg, zip, SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/Blueline-sbom.cdx.json
